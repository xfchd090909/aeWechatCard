<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享测试卡片</title>
    <!-- 基础Open Graph 微信卡片核心配置 -->
    <meta property="og:title" content="《不时用俄语小声说真心话的邻桌艾莉同学》第1话">
    <meta property="og:description" content="剧集播放：1.7亿 | 系列追番：247万">
    <meta property="og:image" content="https://img.cdn1.vip/i/6a7399e65b596_1785960934.webp">
    <meta property="og:url" content="https://aeweccard.netlify.app/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="哔哩哔哩">
    <!-- Twitter兼容标签，微信X5内核兜底渲染 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://img.cdn1.vip/i/6a7399e65b596_1785960934.webp">
    <!-- 禁止页面缓存，方便微信爬虫实时抓取最新代码 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px;
            gap: 30px;
            background: #1a1a1a;
            color: #fff;
        }
        #shareBtn {
            padding: 14px 32px;
            font-size: 18px;
            background: #07C160;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        #shareBtn:active {
            background: #06aa53;
        }
        #tip {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>分享番剧卡片到微信</h2>
    <button id="shareBtn">点击复制分享链接</button>
    <div id="tip">链接已复制，请打开微信粘贴发给好友，自动生成卡片</div>

    <script>
        const shareBtn = document.getElementById('shareBtn');
        // 你的线上网页地址
        const shareUrl = "https://aeweccard.netlify.app/";

        shareBtn.addEventListener('click', async () => {
            try {
                // 复制链接到剪贴板
                await navigator.clipboard.writeText(shareUrl);
                alert("链接复制成功！\n提示：发送时链接末尾加 ?v=1 可避开微信缓存");
            } catch (err) {
                alert("复制失败，请手动复制链接：" + shareUrl);
            }
        })
    </script>
</body>
</html>
